# Render Blueprint: https://render.com/docs/blueprint-spec
# All API keys and the Telegram login are entered on the website's Settings page and stored in the
# database, so DATABASE_URL must point at a PERSISTENT database (e.g. a free Neon/Supabase Postgres URL,
# or Render Postgres). With the default SQLite file on Render's free plan, everything is wiped on restart.
# Free web services also sleep after ~15 min idle, which pauses the 5-minute polling.
services:
  - type: web
    name: openingshub-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: FRONTEND_ORIGIN
        value: https://jatin-29.github.io
      - key: API_KEY            # your admin key: generated here; copy it into the website's Settings page
        generateValue: true
      - key: DATABASE_URL       # paste a Postgres connection string
        sync: false
