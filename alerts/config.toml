# Edit this file to choose what to watch. Commit the change and the next run uses it.

# Telegram groups/channels you have joined (or public ones). Use @username, a t.me link,
# or the numeric id for private groups (run `python alerts/setup.py` to list your chats with ids).
telegram_chats = [
  "-1004427381551",  # Premium Membership (private)
  "me",              # your Saved Messages: forward WhatsApp job posts here and they appear on the website
]

# WhatsApp: MacroDroid on your phone sends each WhatsApp notification to your own Telegram bot as
# "WA: <title> || <text>"; job posts from there go to the website ("WhatsApp · <group>").
# "auto" finds that bot chat by itself; "" turns it off.
whatsapp_inbox = "auto"
# WhatsApp chats or people to ignore completely (part of the group/chat name or the sender's name)
whatsapp_ignore = ["chirag"]

# Your own job group. "auto": the collector creates a private group with Topics on your account (one topic
# per role type below, read-only for members) and sends the invite link to your Saved Messages. "" turns it off.
repost_channel = "auto"
repost_title = "Job Posts"
# Only these sources (job "source" names as shown on the website; "WhatsApp" covers every WhatsApp group)
repost_sources = ["WhatsApp", "Premium Membership", "LinkedIn"]
# Groups never posted (a source name, or how a WhatsApp group's name starts)
repost_skip = ["ep"]
# Role types, one topic each; a job that fits none of them is not posted
repost_categories = ["SDE", "AI/ML", "Data Science", "Analyst", "Product", "QA/Testing", "DevOps/Cloud", "Cybersecurity", "UI/UX Design", "Consulting", "Core/Hardware"]
# Only posts that mention this batch (2027, 2k27, '27 batch…); "" = any batch
repost_batch = "2027"
# Each day, also post matching site jobs from the last N days (posted once only)
repost_recent_days = 3

# LinkedIn: your daily LinkedIn job-alert emails, read from Gmail (secrets GMAIL_ADDRESS + GMAIL_APP_PASSWORD).
# Nothing logs into LinkedIn. Jobs show on the website as "LinkedIn".
linkedin_alerts = true

# YouTube channels: channel URL, @handle, or channel id (UC...).
youtube_channels = [
  # "@SomeJobsChannel",
]

# A post is sent only if it contains at least one `include` word (whole words, case-insensitive;
# end a word with * to match any ending, e.g. "recruit*") and none of the `exclude` words.
include = [
  "hiring", "intern", "interns", "internship", "internships", "freshers", "fresher",
  "opening", "openings", "vacancy", "vacancies", "off campus", "off-campus",
  "walk-in", "walkin", "job", "jobs", "recruit*",
]
# Chats where EVERY text post counts as a job (the include list is ignored, the exclude list still applies).
accept_all = [
  "-1004427381551",  # Premium Membership: a paid job group, posts are jobs even without the keywords
]

exclude = [
  "course", "courses", "bootcamp", "certification", "webinar", "placement guarantee",
  "pay after placement", "registration fee",
]

# On the very first run, how many of the latest posts per source to send (so you can see it works).
# Everything older is skipped; only new posts are sent afterwards.
first_run_backfill = 3

# Longest alert (characters of the original post) before it is cut off.
max_chars = 700
