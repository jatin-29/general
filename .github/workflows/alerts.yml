name: Job alerts

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (GitHub may delay runs a few minutes)
  workflow_dispatch:
    inputs:
      send_test:
        description: "Only send a test message to check delivery"
        type: boolean
        default: false

concurrency:
  group: job-alerts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: alerts/requirements.txt
      - run: pip install -r alerts/requirements.txt

      # "What was already sent" lives in the Actions cache (no commits to your repo).
      - uses: actions/cache/restore@v4
        with:
          path: alerts/state.json
          key: alerts-state-${{ github.run_id }}
          restore-keys: alerts-state-

      - name: Check sources and send alerts
        run: python alerts/run.py ${{ inputs.send_test && '--test' || '' }}
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - uses: actions/cache/save@v4
        if: always() && hashFiles('alerts/state.json') != ''
        with:
          path: alerts/state.json
          key: alerts-state-${{ github.run_id }}
