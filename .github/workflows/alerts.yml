name: Job alerts

on:
  schedule:
    - cron: "4,19,34,49 * * * *"   # every 15 min at quiet minutes (GitHub delays/drops runs at busy :00/:30)
  workflow_dispatch:
    inputs:
      send_test:
        description: "Only send a test message to check delivery"
        type: boolean
        default: false
      fresh:
        description: "Forget what was already sent and resend the latest posts"
        type: boolean
        default: false
      rescan:
        description: "Look again at the latest N posts of each chat (0 = normal run)"
        type: number
        default: 0
      delete:
        description: "Job ids to delete from the website, comma separated (used by the site's delete button)"
        type: string
        default: ""

concurrency:
  group: job-alerts
  cancel-in-progress: false

permissions:
  contents: write   # lets the job save data/jobs.json, which the website shows

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The newest commit of the branch, not the one from when this run was requested: a queued run
      # must see the job list saved by the run before it, or the two versions clash when pushing.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: alerts/requirements.txt
      - run: pip install -r alerts/requirements.txt

      # "What was already sent" lives in the Actions cache (no commits to your repo).
      - uses: actions/cache/restore@v4
        with:
          path: alerts/state.json
          key: alerts-state-${{ github.run_id }}
          restore-keys: alerts-state-

      - name: Check sources and send alerts
        run: python alerts/run.py ${{ inputs.send_test && '--test' || '' }} ${{ inputs.fresh && '--fresh' || '' }} ${{ inputs.rescan && format('--rescan {0}', inputs.rescan) || '' }}
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          DELETE_IDS: ${{ inputs.delete }}

      # New public-channel posts are written to data/jobs.json; commit it so the website can show them.
      - name: Publish new jobs for the website
        run: |
          if [ -n "$(git status --porcelain data/jobs.json)" ]; then
            git config user.name "job-collector"
            git config user.email "actions@users.noreply.github.com"
            git add data/jobs.json
            git commit -m "Update jobs"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      # Only remember what was read if the job list was saved too; otherwise the next run reads it again.
      - uses: actions/cache/save@v4
        if: success() && hashFiles('alerts/state.json') != ''
        with:
          path: alerts/state.json
          key: alerts-state-${{ github.run_id }}
