name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main, claude/festive-heisenberg-vwx16q]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build
        working-directory: frontend
        env:
          # The site reads the job list collected by the "Job alerts" workflow
          NEXT_PUBLIC_JOBS_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.repository.default_branch }}/data/jobs.json
          # Fresher copy (about 1 min instead of about 5); the site falls back to the URL above if the API refuses
          NEXT_PUBLIC_JOBS_API_URL: https://api.github.com/repos/${{ github.repository }}/contents/data/jobs.json?ref=${{ github.event.repository.default_branch }}
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # The delete button asks the "Job alerts" workflow in this repo to remove a job
          NEXT_PUBLIC_GH_REPO: ${{ github.repository }}
          NEXT_PUBLIC_GH_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          npm ci
          npm run build
          touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
